# AeroSpace Window Manager Configuration
# See full docs: https://nikitabobko.github.io/AeroSpace/
# Requires AeroSpace 0.21+ (config-version 2, TOML 1.1 multiline inline tables)

config-version = 2

# Reload automatically whenever this file is saved
auto-reload-config = true

# Borders (JankyBorders) runs as a brew service: ~/.config/borders/bordersrc
after-startup-command = [
    # Sketchybar's LaunchAgent can win the race at login and build the bar before
    # AeroSpace is up (no workspace items). Rebuild it once the server is ready.
    'exec-and-forget /opt/homebrew/bin/sketchybar --reload'
]

start-at-login = true

# All workspaces always exist, so the bar shows every slot even when empty
persistent-workspaces = [
    'B', 'D', 'P', 'A', 'W', 'Q',           # HP Pavilion32
    'S', 'J', 'N', 'M', 'F', 'E', 'O', 'V', # built-in
    'C', 'T', 'K', 'G',                     # Acer XF273 S
]

# Normalizations
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Layout defaults — accordion gives each window full space, cycle with ⌥`
# Toggle to tiles with ⌥E when you want side-by-side.
# Auto keeps portrait displays vertical and landscape displays horizontal.
accordion-padding = 30
default-root-container-layout = 'accordion'
default-root-container-orientation = 'auto'

# Mouse follows focus ONLY on intentional keybinding switches (not on-window-detected)
# Removed: on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
# Instead, move-mouse is attached to each navigation keybinding below

# Prevent cmd-h from hiding apps (common accidental press)
automatically-unhide-macos-hidden-apps = true

# Notify Sketchybar about workspace change (highlights the focused workspace)
exec-on-workspace-change = ['/bin/bash', '-c', 'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE PREV_WORKSPACE=$AEROSPACE_PREV_WORKSPACE']

# Refresh bar app icons whenever focus changes — covers workspace switches,
# windows opening/closing, and windows sent to other workspaces.
# The script is locked + debounced, so frequent firing is cheap.
on-focus-changed = ['exec-and-forget ~/.config/sketchybar/plugins/update_workspace_icon.sh']

# ── Auto-assign apps to workspaces ──
# First match wins. `||` groups several apps onto one workspace.
on-window-detected = [
    # Browser monitor (HP)
    { if = 'test %{app-bundle-id} = com.google.Chrome', run = 'move-node-to-workspace B' },
    { if = 'test %{app-bundle-id} = company.thebrowser.dia', run = 'move-node-to-workspace A' },
    { if = 'test %{app-bundle-id} = com.tinyapp.TablePlus', run = 'move-node-to-workspace D' },
    { if = 'test %{app-bundle-id} = com.postmanlabs.mac', run = 'move-node-to-workspace P' },
    { if = 'test %{app-bundle-id} = dev.commandline.waveterm', run = 'move-node-to-workspace W' },
    { if = 'test %{app-bundle-id} = ai.elementlabs.lmstudio', run = 'move-node-to-workspace Q' },

    # Dev monitor (Acer)
    { if = 'test %{app-bundle-id} = com.microsoft.VSCode', run = 'move-node-to-workspace C' },
    {
        if = 'test %{app-bundle-id} = com.github.wez.wezterm || test %{app-bundle-id} = dev.warp.Warp-Stable',
        run = 'move-node-to-workspace T',
    },
    { if = 'test %{app-bundle-id} = com.electron.dockerdesktop', run = 'move-node-to-workspace K' },
    { if = 'test %{app-bundle-id} = com.anysphere.sand', run = 'move-node-to-workspace G' },

    # Comms / tools monitor (built-in)
    { if = 'test %{app-bundle-id} = com.tinyspeck.slackmacgap', run = 'move-node-to-workspace S' },
    {
        if = 'test %{app-bundle-id} = com.linear || test %{app-bundle-id} = com.apple.iCal',
        run = 'move-node-to-workspace J',
    },
    { if = 'test %{app-bundle-id} = notion.id', run = 'move-node-to-workspace N' },
    { if = 'test %{app-bundle-id} = com.spotify.client', run = 'move-node-to-workspace M' },
    {
        if = 'test %{app-bundle-id} = com.apple.finder || test %{app-bundle-id} = com.apple.Preview',
        run = 'move-node-to-workspace F',
    },
    { if = 'test %{app-bundle-id} = com.apple.systempreferences', run = 'move-node-to-workspace E' },
    {
        # AI coding agents: Codex, Claude, Kimi Code, zcode
        if = 'test %{app-bundle-id} = com.openai.codex || test %{app-bundle-id} = com.anthropic.claudefordesktop || test %{app-bundle-id} = com.kimi.code.desktop || test %{app-bundle-id} = dev.zcode.app',
        run = 'move-node-to-workspace O',
    },
    { if = 'test %{app-bundle-id} = md.obsidian', run = 'move-node-to-workspace V' },
]

# Possible values: (qwerty|dvorak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
preset = 'qwerty'

# Gaps — tighter on laptop, comfortable on externals
[gaps]
inner.horizontal = [{ monitor.'built-in' = 4 }, 10]
inner.vertical = [{ monitor.'built-in' = 4 }, 10]
outer.bottom = [{ monitor.'built-in' = 2 }, 6]
outer.top = [{ monitor.'built-in' = 38 }, 42]
outer.right = [{ monitor.'built-in' = 2 }, 6]
outer.left = [{ monitor.'built-in' = 2 }, 6]

# Keybindings
[mode.main.binding]

# ── Monitor Anchors (mouse follows) ──
alt-1 = ['workspace C', 'move-mouse monitor-lazy-center']
alt-2 = ['workspace S', 'move-mouse monitor-lazy-center']
alt-3 = ['workspace A', 'move-mouse monitor-lazy-center']
alt-shift-left = ['focus-monitor --wrap-around left', 'move-mouse monitor-lazy-center']
alt-shift-right = ['focus-monitor --wrap-around right', 'move-mouse monitor-lazy-center']
cmd-alt-tab = ['focus-monitor --wrap-around next', 'move-mouse monitor-lazy-center']
cmd-shift-alt-tab = ['focus-monitor --wrap-around prev', 'move-mouse monitor-lazy-center']

# ── App Launchers (Cmd+Alt+Letter) ──
cmd-alt-b = 'exec-and-forget open -a "Google Chrome"'
cmd-alt-c = 'exec-and-forget open -a "Visual Studio Code"'
cmd-alt-i = 'exec-and-forget open -a "WezTerm"'
cmd-alt-d = 'exec-and-forget open -a "Dia"'
cmd-alt-g = 'exec-and-forget open -a "Grok Bot"'
cmd-alt-k = 'exec-and-forget open -a "Docker"'
cmd-alt-n = 'exec-and-forget open -a "Notion"'
cmd-alt-p = 'exec-and-forget open -a "Postman"'
cmd-alt-l = 'exec-and-forget open -a "Linear"'
cmd-alt-o = 'exec-and-forget open -a "Codex"'
cmd-alt-w = 'exec-and-forget open -a "Wave"'
cmd-alt-q = 'exec-and-forget open -a "LM Studio"'
cmd-alt-v = 'exec-and-forget open -a "Obsidian"'
cmd-alt-r = ['exec-and-forget /opt/homebrew/bin/sketchybar --reload']

# ── Window Focus (Vim-style) ──
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# ── Cycle Windows in Workspace (like Cmd+` but for tiling) ──
alt-backtick = 'focus dfs-next --boundaries-action wrap-around-the-workspace'
alt-shift-backtick = 'focus dfs-prev --boundaries-action wrap-around-the-workspace'

# ── Layout ──
alt-e = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'
alt-w = 'fullscreen'
alt-y = ['focus right', 'join-with down', 'layout tiles horizontal']

# ── Window Movement ──
ctrl-alt-h = 'move left'
ctrl-alt-j = 'move down'
ctrl-alt-k = 'move up'
ctrl-alt-l = 'move right'

# ── Window Resizing ──
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

# ── Workspace Switching (Alt+Shift+Letter, mouse follows if monitor changes) ──
alt-shift-b = ['workspace B', 'move-mouse monitor-lazy-center']
alt-shift-c = ['workspace C', 'move-mouse monitor-lazy-center']
alt-shift-t = ['workspace T', 'move-mouse monitor-lazy-center']
alt-shift-d = ['workspace D', 'move-mouse monitor-lazy-center']
alt-shift-g = ['workspace G', 'move-mouse monitor-lazy-center']
alt-shift-p = ['workspace P', 'move-mouse monitor-lazy-center']
alt-shift-j = ['workspace J', 'move-mouse monitor-lazy-center']
alt-shift-s = ['workspace S', 'move-mouse monitor-lazy-center']
alt-shift-n = ['workspace N', 'move-mouse monitor-lazy-center']
alt-shift-k = ['workspace K', 'move-mouse monitor-lazy-center']
alt-shift-f = ['workspace F', 'move-mouse monitor-lazy-center']
alt-shift-m = ['workspace M', 'move-mouse monitor-lazy-center']
alt-shift-a = ['workspace A', 'move-mouse monitor-lazy-center']
alt-shift-e = ['workspace E', 'move-mouse monitor-lazy-center']
alt-shift-o = ['workspace O', 'move-mouse monitor-lazy-center']
alt-shift-w = ['workspace W', 'move-mouse monitor-lazy-center']
alt-shift-q = ['workspace Q', 'move-mouse monitor-lazy-center']
alt-shift-v = ['workspace V', 'move-mouse monitor-lazy-center']

# ── Move Window to Workspace (Cmd+Alt+Shift+Letter) ──
cmd-alt-shift-b = 'move-node-to-workspace B'
cmd-alt-shift-c = 'move-node-to-workspace C'
cmd-alt-shift-t = 'move-node-to-workspace T'
cmd-alt-shift-d = 'move-node-to-workspace D'
cmd-alt-shift-g = 'move-node-to-workspace G'
cmd-alt-shift-p = 'move-node-to-workspace P'
cmd-alt-shift-j = 'move-node-to-workspace J'
cmd-alt-shift-s = 'move-node-to-workspace S'
cmd-alt-shift-n = 'move-node-to-workspace N'
cmd-alt-shift-k = 'move-node-to-workspace K'
cmd-alt-shift-f = 'move-node-to-workspace F'
cmd-alt-shift-m = 'move-node-to-workspace M'
cmd-alt-shift-a = 'move-node-to-workspace A'
cmd-alt-shift-e = 'move-node-to-workspace E'
cmd-alt-shift-o = 'move-node-to-workspace O'
cmd-alt-shift-w = 'move-node-to-workspace W'
cmd-alt-shift-q = 'move-node-to-workspace Q'
cmd-alt-shift-v = 'move-node-to-workspace V'

# ── Move Window AND Follow (Ctrl+Alt+Shift+Letter) ──
ctrl-alt-shift-b = ['move-node-to-workspace B', 'workspace B', 'move-mouse monitor-lazy-center']
ctrl-alt-shift-c = ['move-node-to-workspace C', 'workspace C', 'move-mouse monitor-lazy-center']
ctrl-alt-shift-t = ['move-node-to-workspace T', 'workspace T', 'move-mouse monitor-lazy-center']
ctrl-alt-shift-d = ['move-node-to-workspace D', 'workspace D', 'move-mouse monitor-lazy-center']
ctrl-alt-shift-g = ['move-node-to-workspace G', 'workspace G', 'move-mouse monitor-lazy-center']
ctrl-alt-shift-p = ['move-node-to-workspace P', 'workspace P', 'move-mouse monitor-lazy-center']
ctrl-alt-shift-j = ['move-node-to-workspace J', 'workspace J', 'move-mouse monitor-lazy-center']
ctrl-alt-shift-s = ['move-node-to-workspace S', 'workspace S', 'move-mouse monitor-lazy-center']
ctrl-alt-shift-n = ['move-node-to-workspace N', 'workspace N', 'move-mouse monitor-lazy-center']
ctrl-alt-shift-k = ['move-node-to-workspace K', 'workspace K', 'move-mouse monitor-lazy-center']
ctrl-alt-shift-f = ['move-node-to-workspace F', 'workspace F', 'move-mouse monitor-lazy-center']
ctrl-alt-shift-m = ['move-node-to-workspace M', 'workspace M', 'move-mouse monitor-lazy-center']
ctrl-alt-shift-a = ['move-node-to-workspace A', 'workspace A', 'move-mouse monitor-lazy-center']
ctrl-alt-shift-e = ['move-node-to-workspace E', 'workspace E', 'move-mouse monitor-lazy-center']
ctrl-alt-shift-o = ['move-node-to-workspace O', 'workspace O', 'move-mouse monitor-lazy-center']
ctrl-alt-shift-w = ['move-node-to-workspace W', 'workspace W', 'move-mouse monitor-lazy-center']
ctrl-alt-shift-q = ['move-node-to-workspace Q', 'workspace Q', 'move-mouse monitor-lazy-center']
ctrl-alt-shift-v = ['move-node-to-workspace V', 'workspace V', 'move-mouse monitor-lazy-center']

# ── Workspace Utilities ──
# Step through occupied workspaces on the current monitor (⌥[ / ⌥])
alt-leftSquareBracket = 'list-workspaces --monitor focused --empty no | workspace --wrap-around --stdin prev'
alt-rightSquareBracket = 'list-workspaces --monitor focused --empty no | workspace --wrap-around --stdin next'
alt-tab = ['workspace-back-and-forth', 'move-mouse monitor-lazy-center']
alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

# ── Service Mode ──
ctrl-alt-slash = 'mode service'

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main'] # reset layout
f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
backspace = ['close-all-windows-but-current', 'mode main']

# sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
#s = ['layout sticky tiling', 'mode main']

ctrl-alt-h = ['join-with left', 'mode main']
ctrl-alt-j = ['join-with down', 'mode main']
ctrl-alt-k = ['join-with up', 'mode main']
ctrl-alt-l = ['join-with right', 'mode main']

# Force certain workspaces to certain monitors.
# Prefer stable display-name patterns so macOS monitor numbering changes
# do not shuffle workspaces after reloads or restarts.
[workspace-to-monitor-force-assignment]
B = ['HP Pavilion32', 'main', 3]
D = ['HP Pavilion32', 'main', 3]
P = ['HP Pavilion32', 'main', 3]
A = ['HP Pavilion32', 'main', 3]
W = ['HP Pavilion32', 'main', 3]
Q = ['HP Pavilion32', 'main', 3]

S = ['built-in', 2]
J = ['built-in', 2]
N = ['built-in', 2]
M = ['built-in', 2]
F = ['built-in', 2]
E = ['built-in', 2]
O = ['built-in', 2]
V = ['built-in', 2]

C = ['XF273 S', 'acer', 1]
T = ['XF273 S', 'acer', 1]
K = ['XF273 S', 'acer', 1]
G = ['XF273 S', 'acer', 1]
