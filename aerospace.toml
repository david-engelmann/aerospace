# AeroSpace Window Manager Configuration
# See full docs: https://nikitabobko.github.io/AeroSpace/
# Requires AeroSpace 0.21+ (config-version 2, TOML 1.1 multiline inline tables)
#
# One config for both setups:
#   Office  — vertical Acer (left) + laptop (middle) + HP (right)
#   Away    — laptop only: every workspace lives on the laptop screen
# Each app owns one letter workspace. Three key layers, nothing else to learn:
#   ⌥⇧ letter    go to that app (launches it if it isn't open)
#   ⌃⌥⇧ letter   take the current window there
#   ⌥ key        everything about windows (focus, cycle, layout)

config-version = 2

# Reload automatically whenever this file is saved
auto-reload-config = true

# Borders (JankyBorders) runs from ~/Library/LaunchAgents/local.borders.plist
# (config: ~/.config/borders/bordersrc), so it restarts itself if it dies.
after-startup-command = [
    # Known-good state: no native fullscreen, every window on its app's
    # workspace, one window at a time everywhere. See arrange.sh.
    'exec-and-forget ~/.config/aerospace/arrange.sh',
]

start-at-login = true

# All workspaces always exist
persistent-workspaces = [
    'B', 'D', 'P', 'A', 'W', 'Q',           # HP Pavilion32
    'S', 'J', 'N', 'M', 'F', 'E', 'O', 'V', # built-in
    'C', 'T', 'K', 'G',                     # Acer XF273 S
]

# Normalizations
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# One window at a time, full size; ⌥` flips to the next one in the workspace.
# Padding is 0 so windows don't shift around every time focus changes.
# ⌥E puts a workspace side by side, ⌥, brings it back.
accordion-padding = 0
default-root-container-layout = 'accordion'
default-root-container-orientation = 'auto'

# The mouse only moves on deliberate key presses (see bindings), never because
# an app opened a window somewhere — so no on-focused-monitor-changed here.

# Prevent cmd-h from hiding apps (common accidental press)
automatically-unhide-macos-hidden-apps = true

# Redraw the bar's workspace pills on every workspace switch. Deliberately NOT
# on every focus change: that made each focus change trigger extra work.
exec-on-workspace-change = ['/bin/bash', '-c', '~/.config/sketchybar/plugins/workspaces.sh']

# Show a SERVICE badge in the bar while a non-main binding mode is active
on-mode-changed = ['exec-and-forget ~/.config/sketchybar/plugins/aerospace_mode.sh']

# ── Auto-assign apps to workspaces ──
# First match wins. `||` groups several apps onto one workspace.
on-window-detected = [
    # Utilities float on the current workspace instead of being tiled/pinned
    {
        if = 'test %{app-bundle-id} = com.apple.calculator || test %{app-bundle-id} = com.raycast.macos || test %{app-bundle-id} = com.apple.archiveutility || test %{app-bundle-id} = com.apple.installer',
        run = 'layout floating',
    },

    # Browser monitor (HP)
    { if = 'test %{app-bundle-id} = com.google.Chrome', run = 'move-node-to-workspace B' },
    { if = 'test %{app-bundle-id} = company.thebrowser.dia', run = 'move-node-to-workspace A' },
    { if = 'test %{app-bundle-id} = com.tinyapp.TablePlus', run = 'move-node-to-workspace D' },
    { if = 'test %{app-bundle-id} = com.postmanlabs.mac', run = 'move-node-to-workspace P' },
    { if = 'test %{app-bundle-id} = dev.commandline.waveterm', run = 'move-node-to-workspace W' },
    { if = 'test %{app-bundle-id} = ai.elementlabs.lmstudio', run = 'move-node-to-workspace Q' },

    # Dev monitor (Acer)
    { if = 'test %{app-bundle-id} = com.microsoft.VSCode', run = 'move-node-to-workspace C' },
    {
        if = 'test %{app-bundle-id} = com.github.wez.wezterm || test %{app-bundle-id} = dev.warp.Warp-Stable',
        run = 'move-node-to-workspace T',
    },
    { if = 'test %{app-bundle-id} = com.electron.dockerdesktop', run = 'move-node-to-workspace K' },
    { if = 'test %{app-bundle-id} = com.anysphere.sand', run = 'move-node-to-workspace G' },

    # Comms / tools monitor (built-in)
    { if = 'test %{app-bundle-id} = com.tinyspeck.slackmacgap', run = 'move-node-to-workspace S' },
    {
        if = 'test %{app-bundle-id} = com.linear || test %{app-bundle-id} = com.apple.iCal',
        run = 'move-node-to-workspace J',
    },
    { if = 'test %{app-bundle-id} = notion.id', run = 'move-node-to-workspace N' },
    { if = 'test %{app-bundle-id} = com.spotify.client', run = 'move-node-to-workspace M' },
    {
        if = 'test %{app-bundle-id} = com.apple.finder || test %{app-bundle-id} = com.apple.Preview',
        run = 'move-node-to-workspace F',
    },
    {
        if = 'test %{app-bundle-id} = com.apple.systempreferences || test %{app-bundle-id} = com.apple.printcenter',
        run = 'move-node-to-workspace E',
    },
    {
        # AI coding agents: Codex, Claude, Kimi Code, zcode, MiniMax Code
        if = 'test %{app-bundle-id} = com.openai.codex || test %{app-bundle-id} = com.anthropic.claudefordesktop || test %{app-bundle-id} = com.kimi.code.desktop || test %{app-bundle-id} = dev.zcode.app || test %{app-bundle-id} = com.minimax.agent',
        run = 'move-node-to-workspace O',
    },
    { if = 'test %{app-bundle-id} = md.obsidian', run = 'move-node-to-workspace V' },
]

# Possible values: (qwerty|dvorak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
preset = 'qwerty'

# Gaps — tighter on laptop, comfortable on externals
[gaps]
inner.horizontal = [{ monitor.'built-in' = 4 }, 10]
inner.vertical = [{ monitor.'built-in' = 4 }, 10]
outer.bottom = [{ monitor.'built-in' = 2 }, 6]
outer.top = [{ monitor.'built-in' = 38 }, 42]
outer.right = [{ monitor.'built-in' = 2 }, 6]
outer.left = [{ monitor.'built-in' = 2 }, 6]

[mode.main.binding]

# ── ⌥⇧ letter: go to that app. If its workspace is empty, launch the app. ──
alt-shift-a = ['workspace A', 'move-mouse monitor-lazy-center', 'exec-and-forget ~/.config/aerospace/launch-if-empty.sh A -b company.thebrowser.dia']
alt-shift-b = ['workspace B', 'move-mouse monitor-lazy-center', 'exec-and-forget ~/.config/aerospace/launch-if-empty.sh B -b com.google.Chrome']
alt-shift-c = ['workspace C', 'move-mouse monitor-lazy-center', 'exec-and-forget ~/.config/aerospace/launch-if-empty.sh C -b com.microsoft.VSCode']
alt-shift-d = ['workspace D', 'move-mouse monitor-lazy-center', 'exec-and-forget ~/.config/aerospace/launch-if-empty.sh D -b com.tinyapp.TablePlus']
alt-shift-e = ['workspace E', 'move-mouse monitor-lazy-center', 'exec-and-forget ~/.config/aerospace/launch-if-empty.sh E -b com.apple.systempreferences']
alt-shift-f = ['workspace F', 'move-mouse monitor-lazy-center', 'exec-and-forget ~/.config/aerospace/launch-if-empty.sh F /Users/david']
alt-shift-g = ['workspace G', 'move-mouse monitor-lazy-center', 'exec-and-forget ~/.config/aerospace/launch-if-empty.sh G -b com.anysphere.sand']
alt-shift-j = ['workspace J', 'move-mouse monitor-lazy-center', 'exec-and-forget ~/.config/aerospace/launch-if-empty.sh J -b com.linear']
alt-shift-k = ['workspace K', 'move-mouse monitor-lazy-center', 'exec-and-forget ~/.config/aerospace/launch-if-empty.sh K -a Docker']
alt-shift-m = ['workspace M', 'move-mouse monitor-lazy-center', 'exec-and-forget ~/.config/aerospace/launch-if-empty.sh M -b com.spotify.client']
alt-shift-n = ['workspace N', 'move-mouse monitor-lazy-center', 'exec-and-forget ~/.config/aerospace/launch-if-empty.sh N -b notion.id']
alt-shift-o = ['workspace O', 'move-mouse monitor-lazy-center', 'exec-and-forget ~/.config/aerospace/launch-if-empty.sh O -b com.openai.codex']
alt-shift-p = ['workspace P', 'move-mouse monitor-lazy-center', 'exec-and-forget ~/.config/aerospace/launch-if-empty.sh P -b com.postmanlabs.mac']
alt-shift-q = ['workspace Q', 'move-mouse monitor-lazy-center', 'exec-and-forget ~/.config/aerospace/launch-if-empty.sh Q -b ai.elementlabs.lmstudio']
alt-shift-s = ['workspace S', 'move-mouse monitor-lazy-center', 'exec-and-forget ~/.config/aerospace/launch-if-empty.sh S -b com.tinyspeck.slackmacgap']
alt-shift-t = ['workspace T', 'move-mouse monitor-lazy-center', 'exec-and-forget ~/.config/aerospace/launch-if-empty.sh T -b com.github.wez.wezterm']
alt-shift-v = ['workspace V', 'move-mouse monitor-lazy-center', 'exec-and-forget ~/.config/aerospace/launch-if-empty.sh V -b md.obsidian']
alt-shift-w = ['workspace W', 'move-mouse monitor-lazy-center', 'exec-and-forget ~/.config/aerospace/launch-if-empty.sh W -b dev.commandline.waveterm']

# ── ⌃⌥⇧ letter: take the current window to that workspace (and go with it) ──
ctrl-alt-shift-a = 'move-node-to-workspace --focus-follows-window A; move-mouse monitor-lazy-center'
ctrl-alt-shift-b = 'move-node-to-workspace --focus-follows-window B; move-mouse monitor-lazy-center'
ctrl-alt-shift-c = 'move-node-to-workspace --focus-follows-window C; move-mouse monitor-lazy-center'
ctrl-alt-shift-d = 'move-node-to-workspace --focus-follows-window D; move-mouse monitor-lazy-center'
ctrl-alt-shift-e = 'move-node-to-workspace --focus-follows-window E; move-mouse monitor-lazy-center'
ctrl-alt-shift-f = 'move-node-to-workspace --focus-follows-window F; move-mouse monitor-lazy-center'
ctrl-alt-shift-g = 'move-node-to-workspace --focus-follows-window G; move-mouse monitor-lazy-center'
ctrl-alt-shift-j = 'move-node-to-workspace --focus-follows-window J; move-mouse monitor-lazy-center'
ctrl-alt-shift-k = 'move-node-to-workspace --focus-follows-window K; move-mouse monitor-lazy-center'
ctrl-alt-shift-m = 'move-node-to-workspace --focus-follows-window M; move-mouse monitor-lazy-center'
ctrl-alt-shift-n = 'move-node-to-workspace --focus-follows-window N; move-mouse monitor-lazy-center'
ctrl-alt-shift-o = 'move-node-to-workspace --focus-follows-window O; move-mouse monitor-lazy-center'
ctrl-alt-shift-p = 'move-node-to-workspace --focus-follows-window P; move-mouse monitor-lazy-center'
ctrl-alt-shift-q = 'move-node-to-workspace --focus-follows-window Q; move-mouse monitor-lazy-center'
ctrl-alt-shift-s = 'move-node-to-workspace --focus-follows-window S; move-mouse monitor-lazy-center'
ctrl-alt-shift-t = 'move-node-to-workspace --focus-follows-window T; move-mouse monitor-lazy-center'
ctrl-alt-shift-v = 'move-node-to-workspace --focus-follows-window V; move-mouse monitor-lazy-center'
ctrl-alt-shift-w = 'move-node-to-workspace --focus-follows-window W; move-mouse monitor-lazy-center'

# ── Monitors (office): ⌥1 left, ⌥2 middle, ⌥3 right. No-ops on the laptop alone. ──
alt-1 = ['focus-monitor XF273', 'move-mouse monitor-lazy-center']
alt-2 = ['focus-monitor built-in', 'move-mouse monitor-lazy-center']
alt-3 = ['focus-monitor Pavilion', 'move-mouse monitor-lazy-center']

# ── Getting around ──
# Find any window by name (Raycast's Switch Windows) — the fast way to a specific
# VS Code / agent window
alt-space = 'exec-and-forget open -g raycast://extensions/raycast/navigation/switch-windows'
# Previous window (across workspaces/monitors); falls back to previous workspace
alt-tab = 'focus-back-and-forth || workspace-back-and-forth; move-mouse monitor-lazy-center'
# Next / previous window in this workspace
alt-backtick = 'focus dfs-next --boundaries-action wrap-around-the-workspace'
alt-shift-backtick = 'focus dfs-prev --boundaries-action wrap-around-the-workspace'
# Next / previous workspace that has windows, on this monitor
alt-leftSquareBracket = 'list-workspaces --monitor focused --empty no | workspace --wrap-around --stdin prev'
alt-rightSquareBracket = 'list-workspaces --monitor focused --empty no | workspace --wrap-around --stdin next'
# Focus by direction (crosses into the neighbouring monitor at the edge)
alt-h = 'focus --boundaries all-monitors-outer-frame left'
alt-j = 'focus --boundaries all-monitors-outer-frame down'
alt-k = 'focus --boundaries all-monitors-outer-frame up'
alt-l = 'focus --boundaries all-monitors-outer-frame right'

# ── Layout of the current workspace ──
alt-e = 'layout tiles horizontal vertical'         # side by side
alt-comma = 'layout accordion horizontal vertical' # back to one at a time
alt-w = 'fullscreen'
alt-y = ['focus right', 'join-with down', 'layout tiles horizontal']
ctrl-alt-h = 'move left'
ctrl-alt-j = 'move down'
ctrl-alt-k = 'move up'
ctrl-alt-l = 'move right'
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

# ── Service mode: ⌃⌥/ then one key ──
ctrl-alt-slash = 'mode service'

[mode.service.binding]
esc = ['reload-config', 'mode main']
a = ['exec-and-forget ~/.config/aerospace/arrange.sh', 'mode main']         # arrange: put everything back where it belongs
r = ['flatten-workspace-tree', 'mode main']                             # reset this workspace's layout
f = ['layout floating tiling', 'mode main']                             # float / unfloat this window
b = ['exec-and-forget /opt/homebrew/bin/sketchybar --reload', 'mode main'] # reload the bar
backspace = ['close-all-windows-but-current', 'mode main']

# Force certain workspaces to certain monitors.
# Prefer stable display-name patterns so macOS monitor numbering changes
# do not shuffle workspaces after reloads or restarts.
[workspace-to-monitor-force-assignment]
B = ['HP Pavilion32', 'main', 3]
D = ['HP Pavilion32', 'main', 3]
P = ['HP Pavilion32', 'main', 3]
A = ['HP Pavilion32', 'main', 3]
W = ['HP Pavilion32', 'main', 3]
Q = ['HP Pavilion32', 'main', 3]

S = ['built-in', 2]
J = ['built-in', 2]
N = ['built-in', 2]
M = ['built-in', 2]
F = ['built-in', 2]
E = ['built-in', 2]
O = ['built-in', 2]
V = ['built-in', 2]

C = ['XF273 S', 'acer', 1]
T = ['XF273 S', 'acer', 1]
K = ['XF273 S', 'acer', 1]
G = ['XF273 S', 'acer', 1]
